[project]
name = "chenkoai-ai-worker"
version = "0.1.0"
description = "Python AI worker for ChenkoAI embeddings, RAG, evaluation, and model tasks."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.11.0",
  "uvicorn>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.0",
  "pytest>=8.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

