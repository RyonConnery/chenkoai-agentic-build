services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chenkoai
      POSTGRES_PASSWORD: chenkoai_dev_password
      POSTGRES_DB: chenkoai
    ports:
      - "5432:5432"
    volumes:
      - chenkoai_postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - chenkoai_qdrant:/qdrant/storage

volumes:
  chenkoai_postgres:
  chenkoai_qdrant:

